<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="110" fill="none" stroke="#1e293b" stroke-width="8"/>

  <!-- Subtle Apex Peak Chevron -->
  <path d="M256 90 L390 280 L340 280 L256 160 L172 280 L122 280 Z" fill="#10b981" opacity="0.15"/>

  <!-- High-Tech Athletic Dumbbell / Barbell Motif -->
  <g transform="translate(256,260) rotate(-45) translate(-256,-260)">
    <!-- Central Bar -->
    <rect x="156" y="244" width="200" height="32" rx="16" fill="#e2e8f0"/>
    <rect x="196" y="248" width="120" height="24" rx="12" fill="#94a3b8"/>

    <!-- Left Plates -->
    <rect x="136" y="200" width="20" height="120" rx="8" fill="url(#emeraldGrad)" filter="url(#glow)"/>
    <rect x="110" y="215" width="18" height="90" rx="6" fill="#10b981"/>
    <rect x="88" y="230" width="14" height="60" rx="5" fill="#34d399"/>
    <!-- Left Collar -->
    <rect x="158" y="236" width="10" height="48" rx="4" fill="#cbd5e1"/>

    <!-- Right Plates -->
    <rect x="356" y="200" width="20" height="120" rx="8" fill="url(#emeraldGrad)" filter="url(#glow)"/>
    <rect x="384" y="215" width="18" height="90" rx="6" fill="#10b981"/>
    <rect x="410" y="230" width="14" height="60" rx="5" fill="#34d399"/>
    <!-- Right Collar -->
    <rect x="344" y="236" width="10" height="48" rx="4" fill="#cbd5e1"/>
  </g>

  <!-- Apex Lettermark Accent -->
  <path d="M236 390 L256 350 L276 390 Z" fill="#34d399"/>
</svg>
