      <rect x="110" y="215" width="18" height="90" rx="6" fill="#10b981"/>
      <rect x="88" y="230" width="14" height="60" rx="5" fill="#34d399"/>
      <rect x="158" y="236" width="10" height="48" rx="4" fill="#cbd5e1"/>

      <rect x="356" y="200" width="20" height="120" rx="8" fill="url(#emeraldGradMask)"/>
      <rect x="384" y="215" width="18" height="90" rx="6" fill="#10b981"/>
      <rect x="410" y="230" width="14" height="60" rx="5" fill="#34d399"/>
      <rect x="344" y="236" width="10" height="48" rx="4" fill="#cbd5e1"/>
